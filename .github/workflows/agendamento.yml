name: Monitor de Euro Diario

on:
  schedule:
    # Executa todos os dias as 12:00 UTC (09:00 em Brasilia)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite rodar manualmente a qualquer momento para testar

jobs:
  executar-script:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v3

      - name: Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar o monitor de Euro
        run: python monitor_euro.py
